{% extends "base.html" %}

{% block title %}{% if video %}编辑{% else %}添加{% endif %}视频 - {{ app_name }}{% endblock %}

{% block page_title %}{% if video %}✏️ 编辑视频{% else %}➕ 添加视频{% endif %}{% endblock %}

{% block content %}
<div class="card">
    <form method="POST" style="max-width: 900px;">
        <div class="form-group" style="margin-bottom: 1rem;">
            <label>视频名称 *</label>
            <input type="text" name="vod_name" value="{{ video.vod_name if video else '' }}" 
                   required style="width: 100%; padding: 0.5rem; border: 1px solid #ddd; border-radius: 4px;">
        </div>
        
        <div class="form-group" style="margin-bottom: 1rem;">
            <label>分类</label>
            <select name="type_id" style="width: 100%; padding: 0.5rem; border: 1px solid #ddd; border-radius: 4px;">
                <option value="0">请选择分类</option>
                {% for type in types %}
                <option value="{{ type.type_id }}" 
                        {% if video and video.type_id == type.type_id %}selected{% endif %}>
                    {{ type.type_name }}
                </option>
                {% endfor %}
            </select>
        </div>
        
        <div class="form-group" style="margin-bottom: 1rem;">
            <label>状态</label>
            <select name="vod_status" style="width: 100%; padding: 0.5rem; border: 1px solid #ddd; border-radius: 4px;">
                <option value="0" {% if not video or video.vod_status == 0 %}selected{% endif %}>待审核</option>
                <option value="1" {% if video and video.vod_status == 1 %}selected{% endif %}>已审核</option>
            </select>
        </div>
        
        <div class="form-group" style="margin-bottom: 1rem;">
            <label>封面图片</label>
            <input type="text" name="vod_pic" value="{{ video.vod_pic if video else '' }}" 
                   placeholder="图片URL" style="width: 100%; padding: 0.5rem; border: 1px solid #ddd; border-radius: 4px;">
        </div>
        
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1rem;">
            <div>
                <label>演员</label>
                <input type="text" name="vod_actor" value="{{ video.vod_actor if video else '' }}" 
                       style="width: 100%; padding: 0.5rem; border: 1px solid #ddd; border-radius: 4px;">
            </div>
            <div>
                <label>导演</label>
                <input type="text" name="vod_director" value="{{ video.vod_director if video else '' }}" 
                       style="width: 100%; padding: 0.5rem; border: 1px solid #ddd; border-radius: 4px;">
            </div>
        </div>
        
        <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1rem; margin-bottom: 1rem;">
            <div>
                <label>年份</label>
                <input type="text" name="vod_year" value="{{ video.vod_year if video else '' }}" 
                       style="width: 100%; padding: 0.5rem; border: 1px solid #ddd; border-radius: 4px;">
            </div>
            <div>
                <label>地区</label>
                <input type="text" name="vod_area" value="{{ video.vod_area if video else '' }}" 
                       style="width: 100%; padding: 0.5rem; border: 1px solid #ddd; border-radius: 4px;">
            </div>
            <div>
                <label>语言</label>
                <input type="text" name="vod_lang" value="{{ video.vod_lang if video else '' }}" 
                       style="width: 100%; padding: 0.5rem; border: 1px solid #ddd; border-radius: 4px;">
            </div>
        </div>
        
        <div class="form-group" style="margin-bottom: 1rem;">
            <label>备注</label>
            <input type="text" name="vod_remarks" value="{{ video.vod_remarks if video else '' }}" 
                   placeholder="如：更新至第10集" style="width: 100%; padding: 0.5rem; border: 1px solid #ddd; border-radius: 4px;">
        </div>
        
        <!-- 播放地址管理 -->
        <input type="hidden" name="vod_play_from" id="hidden_play_from" value="{{ video.vod_play_from if video else '' }}">
        <input type="hidden" name="vod_play_url" id="hidden_play_url" value="{{ video.vod_play_url if video else '' }}">

        <div id="play-groups-container"></div>

        <div style="margin-top:10px; margin-bottom: 1.5rem;">
            <button type="button" class="btn" style="background: #28a745; color: white; padding: 6px 16px; font-size: 13px;" onclick="addPlayGroup()">＋ 添加一组播放</button>
        </div>
        
        <div class="form-group" style="margin-bottom: 1.5rem;">
            <label>简介</label>
            <textarea name="vod_content" rows="5" 
                      style="width: 100%; padding: 0.5rem; border: 1px solid #ddd; border-radius: 4px;">{{ video.vod_content if video else '' }}</textarea>
        </div>
        
        {% if video %}
        <input type="hidden" name="vod_id" value="{{ video.vod_id }}">
        {% endif %}
        
        <div>
            <button type="submit" class="btn" onclick="syncPlayData(); return true;">保存</button>
            <a href="{{ url_for('video.list') }}" class="btn" style="background: #6c757d; margin-left: 0.5rem;">返回</a>
        </div>
    </form>
</div>

<style>
.play-group {
    background: #f9f9f9;
    border: 1px solid #e0e0e0;
    border-radius: 6px;
    padding: 14px 16px;
    margin-bottom: 12px;
}
.play-group-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
    flex-wrap: wrap;
}
.play-group-header .group-label {
    font-weight: 600;
    font-size: 14px;
    color: #667eea;
    white-space: nowrap;
}
.play-group-header input {
    padding: 6px 10px;
    border: 1px solid #d9d9d9;
    border-radius: 4px;
    font-size: 13px;
    flex: 1;
    min-width: 150px;
}
.play-group-actions {
    display: flex;
    gap: 4px;
    flex-wrap: wrap;
    margin-bottom: 10px;
}
.play-group-actions button {
    padding: 4px 10px;
    font-size: 12px;
    border: 1px solid #d9d9d9;
    background: #fff;
    border-radius: 3px;
    cursor: pointer;
    color: #555;
}
.play-group-actions button:hover {
    border-color: #667eea;
    color: #667eea;
}
.play-group-actions button.btn-act-danger:hover {
    border-color: #ff4d4f;
    color: #ff4d4f;
}
.play-episodes-area {
    width: 100%;
    min-height: 120px;
    border: 1px solid #d9d9d9;
    border-radius: 4px;
    padding: 8px;
    font-size: 13px;
    font-family: 'Consolas', monospace;
    line-height: 1.6;
    resize: vertical;
}
</style>

<script>
var groupCount = 0;

// 初始化：从数据渲染播放组
(function initGroups() {
    var playFrom = '{{ video.vod_play_from if video else "" }}';
    var playUrl = '{{ video.vod_play_url if video else "" }}';
    
    var sourceNames = playFrom ? playFrom.split('$$$') : [];
    var sources = playUrl ? playUrl.split('$$$') : [];
    
    // 至少显示一组
    if (sources.length === 0 || (sources.length === 1 && sources[0] === '')) {
        sourceNames = [''];
        sources = [''];
    }
    
    var container = document.getElementById('play-groups-container');
    for (var i = 0; i < sources.length; i++) {
        var name = sourceNames[i] || '';
        var content = sources[i] || '';
        // 把 # 分隔的集数转为每行一条
        var formatted = content.replace(/#/g, '\n');
        renderPlayGroup(container, name, formatted, i + 1);
    }
})();

function renderPlayGroup(container, playerName, content, index) {
    groupCount++;
    var gid = 'play-group-' + groupCount;
    
    var div = document.createElement('div');
    div.className = 'play-group';
    div.id = gid;
    
    div.innerHTML = '' +
        '<div class="play-group-header">' +
            '<span class="group-label">播放' + index + '：</span>' +
            '<input type="text" class="player-name" placeholder="播放器名称（如：m3u8、次元番A1等）" value="' + escapeHtml(playerName) + '">' +
        '</div>' +
        '<div class="play-group-actions">' +
            '<button type="button" onclick="clearGroup(\'' + gid + '\')">清空</button>' +
            '<button type="button" class="btn-act-danger" onclick="deleteGroup(\'' + gid + '\')">删除</button>' +
            '<button type="button" onclick="moveGroup(\'' + gid + '\', -1)">上移</button>' +
            '<button type="button" onclick="moveGroup(\'' + gid + '\', 1)">下移</button>' +
            '<button type="button" onclick="reverseGroup(\'' + gid + '\')">倒序</button>' +
            '<button type="button" onclick="removePrefixGroup(\'' + gid + '\')">去前缀</button>' +
        '</div>' +
        '<textarea class="play-episodes-area" placeholder="每行一条，格式：集名$播放地址&#10;例如：第01集$https://xxx.m3u8">' + escapeHtml(content) + '</textarea>';
    
    container.appendChild(div);
}

function addPlayGroup() {
    var container = document.getElementById('play-groups-container');
    var index = container.children.length + 1;
    renderPlayGroup(container, '', '', index);
}

function clearGroup(gid) {
    var group = document.getElementById(gid);
    if (group) {
        group.querySelector('.play-episodes-area').value = '';
    }
}

function deleteGroup(gid) {
    if (!confirm('确定删除这组播放数据吗？')) return;
    var group = document.getElementById(gid);
    if (group) {
        group.parentNode.removeChild(group);
        reindexGroups();
    }
}

function moveGroup(gid, direction) {
    var group = document.getElementById(gid);
    var container = group.parentNode;
    if (direction === -1 && group.previousElementSibling) {
        container.insertBefore(group, group.previousElementSibling);
    } else if (direction === 1 && group.nextElementSibling) {
        container.insertBefore(group.nextElementSibling, group);
    }
    reindexGroups();
}

function reverseGroup(gid) {
    var group = document.getElementById(gid);
    var textarea = group.querySelector('.play-episodes-area');
    var lines = textarea.value.split('\n').filter(function(l) { return l.trim() !== ''; });
    lines.reverse();
    textarea.value = lines.join('\n');
}

function removePrefixGroup(gid) {
    var group = document.getElementById(gid);
    var textarea = group.querySelector('.play-episodes-area');
    var lines = textarea.value.split('\n');
    var result = [];
    for (var i = 0; i < lines.length; i++) {
        var line = lines[i].trim();
        if (!line) continue;
        // 去掉集名前缀，只保留 $url 部分，重新编号
        var idx = line.indexOf('$');
        if (idx !== -1) {
            var url = line.substring(idx + 1);
            var num = String(i + 1);
            if (num.length < 2) num = '0' + num;
            result.push('第' + num + '集$' + url);
        } else {
            result.push(line);
        }
    }
    textarea.value = result.join('\n');
}

function reindexGroups() {
    var container = document.getElementById('play-groups-container');
    var groups = container.querySelectorAll('.play-group');
    for (var i = 0; i < groups.length; i++) {
        var label = groups[i].querySelector('.group-label');
        if (label) label.textContent = '播放' + (i + 1) + '：';
    }
}

// 提交前同步数据到隐藏字段
function syncPlayData() {
    var container = document.getElementById('play-groups-container');
    var groups = container.querySelectorAll('.play-group');
    var playFromArr = [];
    var playUrlArr = [];
    
    for (var i = 0; i < groups.length; i++) {
        var input = groups[i].querySelector('.player-name');
        var textarea = groups[i].querySelector('.play-episodes-area');
        
        var playerName = input.value.trim() || '';
        // 把换行转为 # 分隔
        var lines = textarea.value.split('\n').filter(function(l) { return l.trim() !== ''; });
        var urlStr = lines.join('#');
        
        playFromArr.push(playerName);
        playUrlArr.push(urlStr);
    }
    
    document.getElementById('hidden_play_from').value = playFromArr.join('$$$');
    document.getElementById('hidden_play_url').value = playUrlArr.join('$$$');
}

function escapeHtml(str) {
    if (!str) return '';
    var div = document.createElement('div');
    div.appendChild(document.createTextNode(str));
    return div.innerHTML;
}
</script>
{% endblock %}
