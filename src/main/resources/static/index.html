<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>次元方舟视频管理系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 60px;
            max-width: 600px;
            width: 100%;
            text-align: center;
        }

        .logo {
            width: 100px;
            height: 100px;
            margin: 0 auto 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            color: white;
        }

        h1 {
            font-size: 32px;
            color: #333;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            font-size: 16px;
            margin-bottom: 40px;
        }

        .status {
            background: #f0f9ff;
            border-left: 4px solid #0ea5e9;
            padding: 15px 20px;
            margin: 30px 0;
            text-align: left;
        }

        .status-item {
            display: flex;
            justify-content: space-between;
            margin: 10px 0;
            color: #333;
        }

        .status-label {
            font-weight: 600;
        }

        .status-value {
            color: #0ea5e9;
            font-weight: 500;
        }

        .btn-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 40px;
        }

        .btn {
            padding: 15px 30px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #f3f4f6;
            color: #333;
        }

        .btn-secondary:hover {
            background: #e5e7eb;
            transform: translateY(-2px);
        }

        .features {
            text-align: left;
            margin-top: 40px;
            padding-top: 40px;
            border-top: 1px solid #e5e7eb;
        }

        .features h3 {
            color: #333;
            margin-bottom: 20px;
            font-size: 20px;
        }

        .feature-list {
            list-style: none;
        }

        .feature-list li {
            padding: 10px 0;
            color: #666;
            display: flex;
            align-items: center;
        }

        .feature-list li:before {
            content: "✓";
            color: #10b981;
            font-weight: bold;
            margin-right: 10px;
            font-size: 18px;
        }

        @media (max-width: 600px) {
            .container {
                padding: 40px 20px;
            }

            .btn-group {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">🎬</div>
        <h1>次元方舟视频管理系统</h1>
        <p class="subtitle">Video Management System - Spring Boot Edition</p>

        <div class="status">
            <div class="status-item">
                <span class="status-label">系统状态:</span>
                <span class="status-value" id="status">正在检测...</span>
            </div>
            <div class="status-item">
                <span class="status-label">版本号:</span>
                <span class="status-value">v1.0.0</span>
            </div>
            <div class="status-item">
                <span class="status-label">框架:</span>
                <span class="status-value">Spring Boot 3.0.6</span>
            </div>
            <div class="status-item">
                <span class="status-label">数据库:</span>
                <span class="status-value">MySQL (苹果CMS)</span>
            </div>
        </div>

        <div class="btn-group">
            <button class="btn btn-primary" onclick="testApi()">测试API</button>
            <button class="btn btn-secondary" onclick="viewDocs()">查看文档</button>
        </div>

        <div class="features">
            <h3>核心功能</h3>
            <ul class="feature-list">
                <li>视频管理 - 增删改查、批量操作</li>
                <li>分类管理 - 树形结构、无限级分类</li>
                <li>JWT认证 - 安全可靠的令牌认证</li>
                <li>API接口 - RESTful风格接口</li>
                <li>数据统计 - 实时统计视频数据</li>
                <li>高性能 - Redis缓存、JPA优化</li>
            </ul>
        </div>
    </div>

    <script>
        // 检查系统状态
        async function checkHealth() {
            try {
                const response = await fetch('/actuator/health');
                const data = await response.json();
                document.getElementById('status').textContent = '运行正常 ✓';
                document.getElementById('status').style.color = '#10b981';
            } catch (error) {
                document.getElementById('status').textContent = '连接失败 ✗';
                document.getElementById('status').style.color = '#ef4444';
            }
        }

        // 测试API
        async function testApi() {
            try {
                // 测试登录接口
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        username: 'admin',
                        password: 'admin123'
                    })
                });
                
                const result = await response.json();
                
                if (result.code === 200) {
                    alert('✅ API测试成功！\n\n' +
                          '令牌已生成:\n' + 
                          result.data.token.substring(0, 50) + '...\n\n' +
                          '请使用Postman或其他工具测试完整API');
                } else {
                    alert('❌ API测试失败\n\n' + result.message);
                }
            } catch (error) {
                alert('❌ 连接失败\n\n请检查后端服务是否启动');
            }
        }

        // 查看文档
        function viewDocs() {
            alert('📚 API文档说明\n\n' +
                  '认证接口:\n' +
                  '  POST /api/auth/login - 用户登录\n' +
                  '  GET  /api/auth/user - 获取当前用户\n\n' +
                  '视频接口:\n' +
                  '  GET  /api/video/list - 视频列表\n' +
                  '  GET  /api/video/{id} - 视频详情\n' +
                  '  POST /api/video - 添加视频\n' +
                  '  PUT  /api/video/{id} - 更新视频\n' +
                  '  DELETE /api/video/{id} - 删除视频\n\n' +
                  '分类接口:\n' +
                  '  GET  /api/type/tree - 分类树\n' +
                  '  GET  /api/type/list - 分类列表\n\n' +
                  '详细文档请查看 README.md');
        }

        // 页面加载时检查健康状态
        checkHealth();
    </script>
</body>
</html>
